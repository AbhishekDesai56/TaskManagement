<app-new-task [userId] = "userId" (close)="onCloseAddTask()" *ngIf="isAddingTask" />

<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <menu>
      <button (click)="onStartAddTask()">Add Task</button>
    </menu>
  </header>
  <ul>
    <li *ngFor="let task of selectedUserTasks; trackBy: identifyItem">
      <app-task [task]="task"></app-task>
    </li>
  </ul>
</section>
